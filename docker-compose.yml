# ZI-TERPADU: app (Apache + PHP 8.4), scheduler, and MySQL 8.4.
# Configuration comes from .env (see README, section "Menjalankan dengan Docker").

x-app: &app
    build: .
    image: zi-terpadu:latest
    env_file: .env
    environment:
        DB_CONNECTION: mysql
        DB_HOST: mysql
        DB_PORT: 3306
    volumes:
        # Evidence files, logs and framework files survive container rebuilds.
        - storage:/var/www/html/storage
    restart: unless-stopped

services:
    app:
        <<: *app
        ports:
            - '${APP_PORT:-8080}:80'
        depends_on:
            mysql:
                condition: service_healthy
        healthcheck:
            test:
                [
                    'CMD',
                    'php',
                    '-r',
                    "exit(@file_get_contents('http://127.0.0.1/up') === false ? 1 : 0);",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 60s

    # Runs the Laravel scheduler (daily deadline reminders).
    scheduler:
        <<: *app
        command: ['php', 'artisan', 'schedule:work']
        user: www-data
        depends_on:
            app:
                condition: service_healthy

    mysql:
        image: mysql:8.4
        environment:
            MYSQL_DATABASE: ${DB_DATABASE:?Isi DB_DATABASE di .env}
            MYSQL_USER: ${DB_USERNAME:?Isi DB_USERNAME di .env}
            MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
            MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        volumes:
            - mysql:/var/lib/mysql
        healthcheck:
            # TCP ping only succeeds once initialisation has finished.
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '--silent']
            interval: 5s
            timeout: 5s
            retries: 30
            start_period: 30s
        restart: unless-stopped

volumes:
    storage:
    mysql:
