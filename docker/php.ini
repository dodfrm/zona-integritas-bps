; ZI-TERPADU overrides on top of php.ini-production.
expose_php = Off
memory_limit = 256M

; Must be >= ZI_EVIDENCE_MAX_KB (default 20480 KB = 20 MB).
upload_max_filesize = 25M
post_max_size = 26M

; The image is immutable: code only changes by rebuilding, so skip file stat checks.
opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
